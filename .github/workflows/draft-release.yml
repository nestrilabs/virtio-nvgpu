# Keeps one draft release up to date with every commit since the last
# published release: "- <commit title> (@author)", oldest first.
#
# The tag is v<version> from VERSION_FROM, a Cargo.toml: bump it there, in
# the PR that makes the release, and the draft follows. To release: open the
# draft, write anything extra ABOVE the marker line, publish. Text above the marker
# survives every rewrite; everything below it is regenerated on each push.
name: Draft release

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draft-release
  cancel-in-progress: true

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write the commit list into the draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          VERSION_FROM: Cargo.toml
        run: |
          set -euo pipefail
          marker='<!-- everything below is rewritten on every push; write above this line -->'

          # No release yet is a 404, and gh prints the error body to stdout.
          last=$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>/dev/null) || last=
          if [ -n "$last" ]; then range="$last..HEAD"; else range=HEAD; fi
          # Authors as @login, so GitHub links them and one person committing
          # under two names is credited once. The login is GitHub's, from the
          # commit's email; a commit whose email no account claims keeps its
          # git name.
          since=''
          if [ -n "$last" ]; then
            since="&since=$(git log -1 --format=%cI "$last")"
          fi
          gh api "repos/$REPO/commits?sha=$GITHUB_SHA&per_page=100$since" --paginate \
            --jq '.[] | "\(.sha)\t\(.author.login // "")"' > "$RUNNER_TEMP/logins"
          commits=$(git log --reverse --no-merges --format='%H%x09%an%x09%s' "$range" |
            awk -F '\t' -v logins="$RUNNER_TEMP/logins" '
              BEGIN { while ((getline l < logins) > 0) { split(l, f, "\t"); if (f[2] != "") login[f[1]] = f[2] } }
              { who = ($1 in login) ? "@" login[$1] : $2
                s = $0; sub(/^[^\t]*\t[^\t]*\t/, "", s)
                print "- " s " (" who ")" }')
          [ -n "$commits" ] || commits='- (no commits since the last release)'
          if [ -n "$last" ]; then
            heading="Since $last:"
          else
            heading="All commits (no release yet):"
          fi

          draft=$(gh api "repos/$REPO/releases" --paginate \
            --jq '[.[] | select(.draft)] | first | if . then "\(.id)" else empty end' | sed -n 1p)

          if [ -n "$draft" ]; then
            old=$(gh api "repos/$REPO/releases/$draft" --jq '.body // ""')
            # Keep what was written above the marker; a draft without one is
            # all hand-written, so keep it whole.
            top=$(printf '%s\n' "$old" | tr -d '\r' | awk -v m="$marker" '$0 == m { exit } { print }')
          else
            top=''
          fi

          # The version of [package] or [workspace.package], whichever the
          # file has.
          version=$(awk '/^\[(workspace\.)?package\]/ { p = 1; next } /^\[/ { p = 0 }
            p && /^version *=/ { gsub(/^[^"]*"|".*$/, ""); print; exit }' "$VERSION_FROM")
          [ -n "$version" ] || { echo "no version in $VERSION_FROM" >&2; exit 1; }
          next=v$version
          # Released already: the PR that makes the next release has not
          # bumped it yet. Say so at the top rather than guess a number.
          if gh api "repos/$REPO/releases/tags/$next" >/dev/null 2>&1; then
            heading=$(printf '%s\n\n%s' \
              "**$next is already released: bump the version in $VERSION_FROM before publishing.**" \
              "$heading")
          fi

          body=$(printf '%s\n%s\n\n%s\n\n%s\n' "$top" "$marker" "$heading" "$commits")

          if [ -n "$draft" ]; then
            # A PATCH without tag_name leaves a draft untagged, so always send it.
            gh api -X PATCH "repos/$REPO/releases/$draft" \
              -f tag_name="$next" -f name="$next" -f target_commitish="$BRANCH" -f body="$body" >/dev/null
            echo "updated draft $draft ($next)"
          else
            gh api -X POST "repos/$REPO/releases" \
              -f tag_name="$next" -f target_commitish="$BRANCH" -f name="$next" \
              -F draft=true -f body="$body" >/dev/null
            echo "created draft $next"
          fi

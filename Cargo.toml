[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "wlwire",
    "nvgpu-wl-guest",
    "protocol",
    "gen",
    "device",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
protocol = { path = "protocol" }
abi      = { path = "gen" }
wlwire   = { path = "wlwire" }

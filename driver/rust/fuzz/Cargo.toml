[package]
name = "nvgpu-guest-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "GPL-2.0-only"
# Built with nightly by cargo-fuzz; stable builds the crates it drives.
rust-version = "1.87"
description = "cargo-fuzz targets: the differential test, driven by libFuzzer"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nvgpu-guest-core = { path = "../core" }
nvgpu-guest-difftest = { path = "../difftest" }

# Its own workspace: cargo-fuzz builds with a nightly toolchain and
# sanitizer flags the main workspace is not built with.
[workspace]
members = ["."]

[[bin]]
name = "diff_rm"
path = "fuzz_targets/diff_rm.rs"
test = false
doc = false
bench = false

[[bin]]
name = "diff_i2"
path = "fuzz_targets/diff_i2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "diff_atomic"
path = "fuzz_targets/diff_atomic.rs"
test = false
doc = false
bench = false

[[bin]]
name = "i2_raw"
path = "fuzz_targets/i2_raw.rs"
test = false
doc = false
bench = false

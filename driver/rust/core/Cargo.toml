[package]
name = "nvgpu-guest-core"
version.workspace = true
# The kernel builds every Rust object with --edition=2021, and this crate's
# sources are compiled there too (driver/nvgpu_rs.rs), so it is held to it.
edition = "2021"
# What Linux 7.2 accepts (scripts/min-tool-version.sh): the kernel build of
# these sources may use any rustc from there on.
rust-version = "1.85"
license = "GPL-2.0-only"
publish = false
description = "The guest module's untrusted-input parsers: no_std, no unsafe, no kernel dependencies"

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = "warn"

[lints.clippy]
# What the kernel's build turns on for every Rust object (Makefile,
# rust_common_flags), so a host `cargo clippy` sees what a CLIPPY=1 kernel
# build would.
cast_lossless = "warn"
as_underscore = "warn"
ignored_unit_patterns = "warn"
mut_mut = "warn"
needless_bitwise_bool = "warn"
ptr_as_ptr = "warn"
# No panics on guest input: every index is checked, every sum is checked or
# wraps on purpose (the C it replaces wraps where it wraps).
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# `as_chunks` is newer than the oldest rustc Linux 7.2 builds with (1.85).
chunks_exact_to_as_chunks = "allow"

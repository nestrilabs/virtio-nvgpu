[package]
name    = "device"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"

[dependencies]
protocol = { workspace = true }
abi      = { workspace = true }
wlwire   = { workspace = true }

libc      = "0.2"
thiserror = "2"
anyhow = "1"

clap = { version = "4.6", features = ["derive", "string"] }
log = "0.4"
# test-harness only (the `test-bins` feature).
tokio = { version = "1.50", features = ["full"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
vhost-user-backend = { version = "0.23.0", optional = true }
vhost = { version = "0.17.0", optional = true }
virtio-queue = { version = "0.18.0", optional = true }
virtio-bindings = { version = "0.2.7", optional = true }
vm-memory = { version = "0.18.0", features = ["backend-mmap"], optional = true }
env_logger = { version = "0.11.11", optional = true }
vmm-sys-util = { version = "0.15.0", optional = true }

[dev-dependencies]
# The guest module's own IOCTL2 interpreter, run against the backend in
# src/i2_e2e.rs. GPL-2.0, and a dev-dependency only: it is linked into this
# crate's tests and never into anything the crate builds for use (the
# backend binaries stay Apache-2.0).
nvgpu-guest-core = { path = "../driver/rust/core" }

[features]
# The vhost-user transport, off by default.
#
# device/README.md requires this crate to carry no VMM in its dependency list,
# and vhost-user is a VMM-facing transport. Feature-gating it keeps a plain
# `cargo build -p device` free of every crate below.
vhost-user = [
    "dep:vhost",
    "dep:vhost-user-backend",
    "dep:virtio-queue",
    "dep:virtio-bindings",
    "dep:vm-memory",
    "dep:env_logger",
    "dep:vmm-sys-util",
]
env_logger = ["dep:env_logger"]
# The socket test harness, for development only: it serves a backend with no
# sandbox and no posture checks. Never built unless asked for.
test-bins = ["dep:tokio", "dep:tracing", "dep:tracing-subscriber"]
vmm-sys-util = ["dep:vmm-sys-util"]

[[bin]]
name = "vhost-user-nvgpu"
path = "bin/vhost-user-nvgpu.rs"
required-features = ["vhost-user"]

[[bin]]
name = "nvgpu-userspace"
path = "bin/nvgpu-userspace.rs"

[[bin]]
name = "test-harness"
path = "bin/test-harness.rs"
required-features = ["test-bins"]

[lints.rust]
# `cargo fuzz` builds with `--cfg fuzzing` (device/src/fuzzing, fuzz/).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
